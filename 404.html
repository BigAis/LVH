<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Project Allecc</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        /* 404 page styles */
        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 0 20px;
            background-color: #121212;
            color: white;
            position: relative;
            overflow: hidden;
        }
        
        .error-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(106, 13, 173, 0.2) 0%, rgba(18, 18, 18, 1) 70%);
            z-index: 1;
        }
        
        .error-content {
            position: relative;
            z-index: 2;
            max-width: 600px;
        }
        
        .error-code {
            font-size: 8rem;
            font-weight: bold;
            margin-bottom: 20px;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }
        
        .error-title {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        
        .error-message {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
        }
        
        .error-nav {
            margin-bottom: 40px;
        }
        
        .error-nav a {
            margin: 0 10px;
            color: rgba(255, 255, 255, 0.7);
            transition: var(--transition);
            font-weight: 500;
        }
        
        .error-nav a:hover {
            color: white;
        }
        
        .game-character {
            max-width: 300px;
            margin-bottom: 30px;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
            100% {
                transform: translateY(0px);
            }
        }
        
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        
        .particle {
            position: absolute;
            width: 5px;
            height: 5px;
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: particleFloat 15s infinite;
        }
        
        @keyframes particleFloat {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }
        
        .search-box {
            display: flex;
            margin-bottom: 40px;
            width: 100%;
            max-width: 500px;
        }
        
        .search-box input {
            flex-grow: 1;
            padding: 15px 20px;
            border: none;
            border-radius: 5px 0 0 5px;
            outline: none;
            font-size: 1rem;
        }
        
        .search-box button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0 25px;
            border-radius: 0 5px 5px 0;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .search-box button:hover {
            background-color: #5a0b91;
        }
        
        .error-footer {
            margin-top: 50px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
        }
        
        @media (max-width: 768px) {
            .error-code {
                font-size: 6rem;
            }
            
            .error-title {
                font-size: 2rem;
            }
            
            .game-character {
                max-width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-bg"></div>
        <div class="particles" id="particles"></div>
        
        <div class="error-content">
            <img src="/api/placeholder/300/300" alt="Lizard Character" class="game-character">
            
            <div class="error-code">404</div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-message">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable. Don't worry, even our Lizards get lost sometimes.</p>
            
            <div class="search-box">
                <input type="text" placeholder="Search our website...">
                <button><i class="fas fa-search"></i></button>
            </div>
            
            <div class="error-nav">
                <a href="index.html"><i class="fas fa-home"></i> Home</a>
                <a href="games.html"><i class="fas fa-gamepad"></i> Games</a>
                <a href="documentation.html"><i class="fas fa-book"></i> Documentation</a>
                <a href="contact.html"><i class="fas fa-envelope"></i> Contact</a>
            </div>
            
            <div class="error-buttons">
                <a href="index.html" class="btn btn-primary">Back to Home</a>
            </div>
            
            <div class="error-footer">
                <p>© 2025 Project Allecc. All Rights Reserved.</p>
            </div>
        </div>
    </div>
    
    <script>
        // Create floating particles
        const particlesContainer = document.getElementById('particles');
        const particleCount = 30;
        
        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            // Random size
            const size = Math.random() * 5 + 2;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            
            // Random position
            const posX = Math.random() * 100;
            const posY = Math.random() * 100;
            particle.style.left = `${posX}%`;
            particle.style.top = `${posY}%`;
            
            // Random opacity
            particle.style.opacity = Math.random() * 0.5 + 0.1;
            
            // Random animation duration and delay
            const duration = Math.random() * 10 + 10;
            const delay = Math.random() * 5;
            particle.style.animation = `particleFloat ${duration}s ${delay}s infinite`;
            
            particlesContainer.appendChild(particle);
        }
        
        // Search functionality
        document.querySelector('.search-box').addEventListener('submit', function(e) {
            e.preventDefault();
            const searchTerm = document.querySelector('.search-box input').value;
            
            // In a real implementation, this would redirect to search results
            // For now, just go to home page
            window.location.href = 'index.html';
        });
        
        // Make search box button work
        document.querySelector('.search-box button').addEventListener('click', function() {
            document.querySelector('.search-box').dispatchEvent(new Event('submit'));
        });
    </script>
</body>
</html>
